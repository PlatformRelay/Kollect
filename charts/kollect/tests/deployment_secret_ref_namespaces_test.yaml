suite: deployment allow-secret-ref-namespaces (K-04)
templates:
  - deployment.yaml
tests:
  - it: does not pass --allow-secret-ref-namespaces by default (deny by default)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --allow-secret-ref-namespaces=shared-creds
  - it: passes --allow-secret-ref-namespaces when the allowlist is set
    set:
      allowSecretRefNamespaces:
        - shared-creds
        - team-a
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --allow-secret-ref-namespaces=shared-creds,team-a
  - it: omits --allow-secret-ref-namespaces when the allowlist is empty
    set:
      allowSecretRefNamespaces: []
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --allow-secret-ref-namespaces=
