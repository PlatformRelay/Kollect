# Default values for the kollect operator Helm chart.

# -- Override the chart name used in labels and resource names.
nameOverride: ""
# -- Override the full resource name prefix (defaults to release name + chart name).
fullnameOverride: ""

# -- Create the release namespace if it does not exist.
createNamespace: false

image:
  # -- Controller container image repository.
  repository: ghcr.io/platformrelay/kollect
  # -- Controller image tag. Defaults to `v<appVersion>` (the published controller image tag) when empty.
  tag: ""
  # -- Controller image pull policy.
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries.
imagePullSecrets: []

# -- Manager Deployment replica count.
replicaCount: 1

serviceAccount:
  # -- Create a ServiceAccount for the manager pod.
  create: true
  # -- ServiceAccount name (generated when empty).
  name: ""
  # -- Annotations added to the ServiceAccount.
  annotations: {}

rbac:
  # -- Create RBAC roles/bindings for the manager.
  create: true

# -- Restrict the manager informer cache to these namespaces (empty = all namespaces). Use for per-team operator installs.
watchNamespaces: []

# -- Default namespace allowlist for Target collection intent (CRD fields on KollectTarget override).
defaultIncludedNamespaces: []
# -- Default namespace denylist for Target collection intent (CRD fields on KollectTarget override).
defaultExcludedNamespaces: []

# -- When true, render namespaced Role/RoleBinding instead of ClusterRole/ClusterRoleBinding.
tenantMode: false

# -- NET-01 (SSRF opt-in, cluster-admin only). When true, sink endpoints may
# resolve to RFC1918 / IPv6-ULA (in-cluster ClusterIP) addresses at both
# admission and dial time — for exporting to in-cluster Postgres/MinIO/NATS.
# Default false (deny). Loopback, link-local, cloud-metadata, and file:// stay
# denied even when enabled. Enabling widens SSRF reach to RFC1918/VPC peers
# reachable from the manager pod: a principal who can create/edit sink CRs can
# then aim connection-tests/exports at those targets. Enable only in private
# clusters with trusted sink-CR authors. This is NOT a per-tenant/CRD field.
allowPrivateSinks: false

# -- Operator deployment mode (single-cluster only).
mode: single

# -- Defaults for KollectSink connection probes in bundled samples (CRD default is true).
sinkDefaults:
  # -- Default spec.connectionTest for sample sinks (CI/dev overlays often set true).
  connectionTest: false

leaderElection:
  # -- Enable controller-runtime leader election.
  enabled: true
  # Timings. Empty means "use the binary's own defaults" (60s/40s/5s), which are deliberately more
  # patient than controller-runtime's 15s/10s/2s: the shipped topology is a single replica, so
  # there is no standby to fail over to and an aggressive renew deadline only turns a brief
  # API-server blip into downtime. Set these to tighten failover if you run multiple replicas.
  #
  # Invariant enforced by client-go at startup: retryPeriod < renewDeadline < leaseDuration.
  # -- How long non-leaders wait before trying to acquire leadership (e.g. `60s`).
  leaseDuration: ""
  # -- How long the leader retries renewing before exiting; this is the API outage it can ride out.
  renewDeadline: ""
  # -- Interval between leadership renewal attempts.
  retryPeriod: ""

featureGates:
  inventoryHttp:
    # -- Expose read-only GET /inventory HTTP API (debug/small installs only).
    enabled: false
    # -- Inventory HTTP listen port.
    port: 8082
    # -- Inventory HTTP auth mode: kubernetes (TokenReview/SAR) or disabled (dev only).
    authMode: kubernetes

# -- Optional oauth2-proxy sidecar for browser/OIDC access (not rendered yet).
oauth2Proxy:
  # -- Enable oauth2-proxy sidecar in front of inventory HTTP.
  enabled: false

pprof:
  # -- Enable Go pprof debug endpoint on the manager.
  enabled: false
  # -- pprof bind address.
  bindAddress: ":6060"

controller:
  maxConcurrentReconciles:
    # -- Max concurrent reconciles for KollectTarget.
    target: 5
    # -- Max concurrent reconciles for KollectInventory.
    inventory: 3
  # -- Collection informer dispatch worker count (PERF-03).
  collectDispatchWorkers: 4
  # -- Collection informer dispatch queue depth.
  collectDispatchQueueSize: 512
  informerResyncPeriod: 12h
  collectMetricsSampleInterval: 30s
  reconcileRateLimit: ""

resourcesProfile: default

largeCluster:
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 4Gi
    requests:
      cpu: 500m
      memory: 2Gi
  controller:
    maxConcurrentReconciles:
      target: 10
      inventory: 10
    collectDispatchWorkers: 8
    collectDispatchQueueSize: 2048

metrics:
  # -- Expose Prometheus metrics endpoint.
  enabled: true
  # -- Metrics bind address.
  bindAddress: ":8443"
  # -- Serve metrics over HTTPS with bearer token auth.
  secure: true
  readerRole:
    # -- Create the ClusterRole/Binding that authorizes reading `/metrics`. With `secure: true` the
    # endpoint authorizes every request against RBAC, so without this nothing — including the
    # operator's own ServiceAccount — can scrape it, and `/metrics` answers 403 to everything.
    create: true
    # -- Additional subjects to bind, e.g. the ServiceAccount your Prometheus runs as.
    # Each entry is a standard RBAC subject: `{kind, name, namespace}`.
    extraSubjects: []
  # -- Prometheus Operator ServiceMonitor integration (requires monitoring.coreos.com CRDs).
  serviceMonitor:
    # -- Create a ServiceMonitor resource.
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout.
    scrapeTimeout: 10s
    # -- Labels merged onto ServiceMonitor (must match Prometheus serviceMonitorSelector).
    labels: {}
  prometheusRule:
    # -- Create a PrometheusRule with starter kollect alerts.
    enabled: false
    # -- Labels merged onto PrometheusRule (must match Prometheus ruleSelector).
    labels: {}
    # -- Extra PrometheusRule entries appended to the kollect.rules group.
    additionalRules: []

webhooks:
  # -- Enable validating admission webhooks for Kollect CRDs.
  enabled: true
  certManager:
    # -- Create cert-manager Certificate/Issuer for webhook serving cert.
    create: true
    # -- Secret name for webhook TLS material.
    secretName: webhook-server-cert

resources:
  limits:
    cpu: 500m
    memory: 256Mi
    # -- Ephemeral-storage limit bounding writable-layer/tmp emptyDir usage (git mirror clones, exports) so a runaway container cannot exhaust node disk (KO-05).
    ephemeral-storage: 1Gi
  requests:
    cpu: 10m
    memory: 64Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# -- Extra arguments passed to the manager container.
extraArgs: []

