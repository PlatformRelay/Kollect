sonar.projectKey=PlatformRelay_Kollect
sonar.organization=platformrelay
sonar.projectName=Kollect
sonar.sources=.
# NOTE (SEC-04i/KO-09): hack/demo/** and hack/loadtest/** (demo and load-test
# scripts that curl/kubectl a live cluster, not production code) are already
# covered by the **/hack/** entry below -- sonar.exclusions removes matched
# files from analysis for every rule category (including Security Hotspots),
# so no separate entry or property is needed. Regression-guarded by
# hack/test/sonar_ko_09_exclusions_test.sh.
sonar.exclusions=**/zz_generated.*,**/vendor/**,**/charts/**,**/hack/**,**/test/**,**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
sonar.coverage.exclusions=**/api/**,**/cmd/**,**/test/**

# NOTE (SONAR-SEC-02): go:S1313 flags hardcoded IP addresses. In the netguard
# SSRF dialer (internal/sink/netguard/**) and the endpoint deny-list
# (internal/validation/endpoint_guard.go) the hardcoded IPs/CIDRs ARE the
# security control -- RFC1918/CGNAT/benchmark ranges, loopback, IPv6 ULA/
# link-local, and the cloud instance-metadata addresses (169.254.169.254 /
# fd00:ec2::254) that must be denied to block SSRF. These literals are
# deliberate and audited (endpoint_guard's deny-CIDR list is itself locked by
# hack/test/sonar_ko_07_deny_cidr_comment_test.sh), so S1313 here is a false
# positive. Scope the ignore narrowly to those two paths only.
# Structurally regression-guarded by hack/test/sonar_ko_10_s1313_multicriteria_test.sh.
#
# NOTE (SONAR-QUAL-01): docker:S8431 wants a Dockerfile HEALTHCHECK. Runtime
# health is owned by Kubernetes liveness/readiness probes on the Deployment;
# Docker HEALTHCHECK would duplicate that and typically needs a shell/curl on
# the nonroot image. Narrow ignore on the two product Dockerfiles only.
# Structurally regression-guarded by hack/test/sonar_ko_11_docker_s8431_multicriteria_test.sh.
sonar.issue.ignore.multicriteria=s1313netguard,s1313endpointguard,dockers8431root,dockers8431pipeline
sonar.issue.ignore.multicriteria.s1313netguard.ruleKey=go:S1313
sonar.issue.ignore.multicriteria.s1313netguard.resourceKey=**/internal/sink/netguard/**/*
sonar.issue.ignore.multicriteria.s1313endpointguard.ruleKey=go:S1313
sonar.issue.ignore.multicriteria.s1313endpointguard.resourceKey=**/internal/validation/endpoint_guard.go
sonar.issue.ignore.multicriteria.dockers8431root.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.dockers8431root.resourceKey=**/Dockerfile
sonar.issue.ignore.multicriteria.dockers8431pipeline.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.dockers8431pipeline.resourceKey=**/Dockerfile.pipeline
