## Advanced / multi-sink samples (opt-in) ##
# Apply explicitly after creating Secrets / backing stores:
#   kubectl apply -f config/samples/dev/postgres.yaml
#   kubectl -n kollect-system create secret generic inventory-postgres-dsn \
#     --from-literal=dsn='postgres://kollect:example@postgres.kollect-system.svc:5432/inventory?sslmode=disable'
#   kubectl apply -k config/samples/advanced/
#
# Not part of default `task dev-up` (DEMO-01).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- kollect_v1alpha1_kollectsnapshotsink.yaml
- kollect_v1alpha1_kollectsnapshotsink_git_minimal.yaml
- kollect_v1alpha1_kollectsnapshotsink_git_layout.yaml
- kollect_v1alpha1_kollectsnapshotsink_git_resource_tree.yaml
- kollect_v1alpha1_kollectsnapshotsink_s3.yaml
- kollect_v1alpha1_kollectdatabasesink.yaml
- kollect_v1alpha1_kollectdatabasesink_bigquery.yaml
- kollect_v1alpha1_kollectdatabasesink_mongodb.yaml
- kollect_v1alpha1_kollecteventsink_kafka.yaml
- kollect_v1alpha1_kollectinventory.yaml
- kollect_v1alpha1_kollectinventory_sharded.yaml
- kollect_v1alpha1_kollectinventory_export-partitioning.yaml
- kollect_v1alpha1_kollectconnectiontest.yaml
- kollect_v1alpha1_kollectclusterinventory.yaml
