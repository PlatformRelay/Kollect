# Dual-cadence export (ADR-0413): Postgres portal @ 30s + Git audit @ 1h.
# Opt-in advanced path — apply via `kubectl apply -k config/samples/advanced/`
# after creating the Postgres Secret (not part of default `task dev-up`, DEMO-01).
apiVersion: kollect.dev/v1alpha1
kind: KollectInventory
metadata:
  name: team-inventory
  namespace: default
  labels:
    app.kubernetes.io/name: kollect
    app.kubernetes.io/managed-by: kustomize
spec:
  exportMinInterval: 30s
  databaseSinkRefs:
    - name: postgres-inventory-demo
  snapshotSinkRefs:
    - name: git-inventory-demo
      exportMinInterval: 1h
  suspend: false
