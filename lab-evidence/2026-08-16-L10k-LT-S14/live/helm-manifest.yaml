---
# Source: kollect/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kollect-op1-controller-manager
  namespace: kollect-op1
  labels:
    helm.sh/chart: kollect-0.17.0
    app.kubernetes.io/name: kollect
    control-plane: controller-manager
    app.kubernetes.io/version: "0.17.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kollect
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: kollect
        control-plane: controller-manager
    spec:
      serviceAccountName: kollect-op1-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: ghcr.io/platformrelay/kollect:v0.17.0
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --metrics-secure=true
            - --max-concurrent-reconciles-target=10
            - --max-concurrent-reconciles-inventory=10
            - --collect-dispatch-workers=8
            - --collect-dispatch-queue-size=2048
            - --informer-resync-period=12h
            - --collect-metrics-sample-interval=30s
            - --validating-webhooks-enabled=false
            - --allow-private-sinks
            - --watch-namespaces=kol-op1-ns-001,kol-op1-ns-002,kol-op1-ns-003,kol-op1-ns-004,kol-op1-ns-005,kol-op1-ns-006,kol-op1-ns-007,kol-op1-ns-008,kol-op1-ns-009,kol-op1-ns-010
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              cpu: "2"
              ephemeral-storage: 4Gi
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist


