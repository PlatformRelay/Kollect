# ---------------------------------------------------------------------------------
# THREE THINGS TO KNOW BEFORE EDITING THIS FILE
# ---------------------------------------------------------------------------------
#
# 1. ghcr.io/platformrelay/charts/kollect holds CHARTS ONLY.
#    That is the entire point of ADR-0709. Artifact Hub's documented contract is one
#    chart per repository entry (`oci://registry/namespace/chart-name`), and nothing
#    in it can be told to skip non-chart artifacts. So the path is kept clean instead:
#    never push an image, a bundle, or anything else here.
#
# 2. The DR-FIND-07 image/chart collision lives at the OTHER path, permanently.
#    ghcr.io/platformrelay/kollect serves the controller image at v-prefixed tags
#    (v0.18.0) and, for everything released before ADR-0709, the Helm chart at bare
#    semver tags (0.18.0). The image does NOT move — its digest is pinned immutably in
#    OLM bundles already merged into the community catalogs — and the old bare chart
#    tags are not deletable-by-policy either, so that path stays mixed forever. It is
#    simply no longer tracked by Artifact Hub, which makes the mixture inert.
#
# 3. `ignore` FILTERS INDEXING, NEVER LOADING. THIS IS WHY THERE IS NO IGNORE LIST.
#    ############################################################################
#    #  Do NOT add an `ignore:` entry here to silence an Artifact Hub           #
#    #  "error preparing package: error loading chart ... layer not found"      #
#    #  tracking mail. It cannot work, and it has already been tried twice.     #
#    ############################################################################
#    Artifact Hub's helm tracker lists every semver-ish tag and DOWNLOADS each one
#    (`preparePackage()`) before the repository's ignore list is applied — ignore
#    covers "packages that should not be *indexed*", strictly after the load. That
#    exactly explains the observation that burned two sessions: bare 0.9.0–0.13.0 were
#    correctly absent from `available_versions` while their load errors kept arriving.
#    The regex is not the lever. If load errors appear, the fix is what is being loaded
#    (i.e. what is pushed to this path), never a filter. See ADR-0709, "Why no Artifact
#    Hub setting fixes this".
#
# The previous ignore list (v-prefixed image tags plus the broken 0.9.0–0.13.0 charts)
# was deleted with the move and must not come back: no v* tags are pushed to this path,
# and charts 0.9.0–0.13.0 are deleted from the registry and must never be republished —
# they hardcode `image.tag: latest`, a tag that was never pushed, so they cannot install
# (the manager would sit in ImagePullBackOff). A regex matching nothing is not a safety
# net; it reads like one, which is how it got tuned instead of understood.
