# Artifact Hub repository metadata (ADR-0708, ADR-0709), pushed to
# ghcr.io/<owner>/charts/kollect:artifacthub.io by the release workflow.
#
# That coordinate is correct once the release workflow publishes the chart under charts/
# — ADR-0709 runbook step 2, which is a separate change from this file and precedes it.
# Like every comment here, the line above describes the migration's target layout.
#
# MIND THE TENSE IN THIS FILE. Its bytes are `oras push`ed to the registry at the release
# step, which runs BEFORE the maintainer repoints the registered Artifact Hub URL in the
# control panel (a human action, late in the ADR-0709 runbook). Anything written here as
# an accomplished fact about Artifact Hub's own state is therefore published while it is
# still false. Describe the mechanism instead: what an action does whenever it happens.
#
# 2026-08-18 — repository registered on Artifact Hub as `kollect`
# (https://artifacthub.io/packages/search?repo=kollect); Verified Publisher active.
# ADR-0709 repoints that registration at the charts/ path. Editing a registered URL in
# place keeps the repository ID, stars and Verified Publisher status — `Manager.Update`
# keys on repository NAME, not URL — so the listing survives the move.
#
# Verified Publisher requires BOTH: the pushed repositoryID matches the registered
# one, AND the owner email matches the email on the Artifact Hub account that owns
# the repository (account `konih`). Artifact Hub compares the two addresses directly
# — it does not send a verification mail. Keep both keys below.
