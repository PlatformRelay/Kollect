site_name: Kollect
site_description: Your cluster, in Git, diffable.
site_url: https://platformrelay.github.io/Kollect/
repo_url: https://github.com/platformrelay/kollect
repo_name: platformrelay/kollect
copyright: Copyright &copy; 2026 Konrad Heimel

theme:
  name: material
  custom_dir: overrides
  logo: assets/branding/kollect-app-icon-1024.png
  favicon: assets/favicon.ico
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

nav:
  - Overview:
      - Home: index.md
  - Getting started:
      - Install Kollect: getting-started/install.md
      - Your first inventory: getting-started/first-inventory.md
  - Examples:
      - All examples: examples/README.md
      - Helm / Argo release inventory: examples/helm-release-inventory.md
      - Cluster-scoped rollup: examples/cluster-rollup.md
      - Multi-tenant watch scope: examples/multi-tenant-watch-namespaces.md
      - Team-owned operator: examples/team-operator.md
      - Postgres state store: examples/postgres-state-store.md
      - Kafka event sink: examples/kafka-event-sink.md
      - NATS event sink: examples/nats-event-sink.md
      - Test sink connectivity: examples/connection-test.md
      - Multi-cluster fleet: examples/multi-cluster-fleet.md
      - Collect from CI: guides/pipeline-cli.md
  - Concepts:
      - The resource model: concepts/resource-model.md
      - How collection works: concepts/collection.md
      - Export pipeline and debouncing: concepts/export-pipeline.md
      - "Sink roles: state, snapshots, and streams": concepts/sinks.md
      - Multi-tenancy and scopes: concepts/multi-tenancy.md
      - Multi-cluster fleet: concepts/multi-cluster.md
      - Architecture: concepts/architecture.md
  - Operate:
      - Operator manual: operator-manual/index.md
      - Helm values: operator-manual/helm-values.md
      - Upgrading: operator-manual/upgrading.md
      - Metrics: operator-manual/metrics.md
      - Performance and scaling: operator-manual/performance.md
      - Troubleshooting: operator-manual/troubleshooting.md
      - Production checklist: operator-manual/production-checklist.md
      - Deployment topology matrix: deployment/topology-matrix.md
      - Read-only UI (frozen preview): operator-manual/ui.md
  - Reference:
      - Custom resources:
          - Overview: crds/index.md
          - KollectProfile: crds/kollectprofile.md
          - KollectSnapshotSink: crds/kollectsnapshotsink.md
          - KollectDatabaseSink: crds/kollectdatabasesink.md
          - KollectEventSink: crds/kollecteventsink.md
          - KollectTarget: crds/kollecttarget.md
          - KollectInventory: crds/kollectinventory.md
          - KollectScope: crds/kollectscope.md
          - KollectClusterScope: crds/kollectclusterscope.md
          - KollectConnectionTest: crds/kollectconnectiontest.md
          - KollectClusterTarget: crds/kollectclustertarget.md
          - KollectClusterInventory: crds/kollectclusterinventory.md
      - Conditions and status: reference/conditions.md
      - Annotations and labels: ANNOTATIONS-LABELS.md
      - Command reference: COMMAND-REFERENCE.md
      - Glossary: GLOSSARY.md
  - Design & internals:
      - Specifications:
          - Requirements: REQUIREMENTS.md
          - Platform decisions: PLATFORM-DECISIONS.md
          - Roadmap: ROADMAP.md
          - Planned features: roadmap/planned-features.md
      - Security & assurance:
          - Security architecture: security/security-architecture.md
          - Assurance case: ASSURANCE-CASE.md
          - Security review: SECURITY-REVIEW.md
          - SCA remediation policy: security/sca-remediation-policy.md
          - Resolved-address policy: security/resolved-address-policy.md
      - Architecture decisions: adr/README.md
      - Requests for comments: rfc/README.md
      - Contributing:
          - Contributor setup: development/setup.md
          - Governance: development/governance.md
          - Engineering guidelines: development/guidelines.md
          - Coding standards: development/coding-standards.md
          - Testing strategy: development/testing.md
          - Tooling setup: development/tooling-setup.md
          - Local container images: development/local-container-image.md
          - Git sink attribution: development/git-sink-attribution.md
          - ADR and RFC process: development/adr-rfc-process.md
          - UI local development: examples/ui-local-development.md
      - Release engineering:
          - Release process: RELEASE.md
          - Load test runbook: operator-manual/load-test-runbook.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - docs/_snippets
      check_paths: true
  - toc:
      permalink: true

plugins:
  - search
  - redirects:
      redirect_maps:
        QUICKSTART.md: getting-started/install.md
        UNDERSTAND-THE-BASICS.md: concepts/resource-model.md
        FAQ.md: operator-manual/troubleshooting.md
        ARCHITECTURE.md: concepts/architecture.md
        DATA-FLOWS.md: concepts/export-pipeline.md
        BEST-PRACTICES.md: operator-manual/production-checklist.md
        TROUBLESHOOTING.md: operator-manual/troubleshooting.md
        PERFORMANCE.md: operator-manual/performance.md
        CR-REFERENCE.md: crds/index.md
        OPERATOR-MANUAL.md: operator-manual/index.md
        DEVELOPMENT.md: development/setup.md
        operator-manual/common-errors.md: operator-manual/troubleshooting.md
        operator-manual/scaling-and-fleet.md: operator-manual/performance.md
        deployment/team-operator.md: examples/team-operator.md
        examples/kind-local-lab.md: getting-started/install.md
        examples/deployment-inventory.md: getting-started/first-inventory.md
        examples/cert-manager-webhook.md: operator-manual/index.md
        examples/kollect-inventory-demo.md: examples/README.md
  - social:
      cards_layout_options:
        background_color: "#0F172A"
        color: "#F8FAFC"

docs_dir: docs
site_dir: site

# Include-fragments and local tooling artifacts are not pages.
# _snippets/ holds snippet sources; node_modules/ is created locally by
# `task lint:markdown` (gitignored) and must never be scanned as docs.
exclude_docs: |
  _snippets/
  node_modules/

# Deep reference pages remain reachable by URL and are linked from their section indexes.
not_in_nav: |
  /DEMO-GIF-GUIDE.md
  /adr/*.md
  /rfc/*.md

validation:
  omitted_files: warn
  unrecognized_links: warn
  absolute_links: relative_to_docs

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/platformrelay/kollect
