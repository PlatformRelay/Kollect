# kollect lab substrate allowlist (LAB-DEKIND).
#
# Lab tooling (pprof capture, load, webhook assertions) refuses ANY kube context that is
# not matched here. This is a DEFAULT-DENY list: an unknown context is refused, never
# allowed. The operator's ambient context is a production cluster — treat every widening
# of this file as a security change.
#
# Format:  <context-pattern>  <substrate>  [expected-cluster]
#   context-pattern   exact context name, or a single trailing '*' (>= 4 literal chars)
#   substrate         kind | talos | generic — drives image delivery (see lib/substrate.sh)
#   expected-cluster  optional; when set and readable it can only REFUSE a mismatch,
#                     it never admits a context that the pattern did not already match
#
# Additions for a one-off substrate go in KOLLECT_LAB_ALLOWED_CONTEXTS
# ("pattern[=substrate[=cluster]]", comma or space separated) — same validation applies.

kind-*        kind
kumulus-lab   talos   kumulus
