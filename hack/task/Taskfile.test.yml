# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: "3"

set:
  - pipefail

run: once

env:
  GOTOOLCHAIN:
    sh: echo "go$(sed -n 's/^go //p' go.mod | head -1)"

tasks:
  run:
    desc: Run unit tests (excludes e2e; no race detector — use coverage:race locally)
    cmds:
      - make test

  coverage:
    desc: Unit/envtest with internal/ coverage.out and floor (COVERAGE_MIN, default 65)
    cmds:
      - bash hack/coverage.sh

  coverage:race:
    desc: Same as coverage with COVERAGE_RACE=1 (local + nightly advisory; requires CGO)
    env:
      CGO_ENABLED: "1"
      COVERAGE_RACE: "1"
    cmds:
      - bash hack/coverage.sh

  coverage:report:
    desc: Print go tool cover -func summary from coverage.out
    cmds:
      - |
        if [ ! -s coverage.out ]; then
          echo "coverage.out missing; run task coverage first" >&2
          exit 1
        fi
      - go tool cover -func=coverage.out | tee coverage-summary.txt

  coverage:html:
    desc: Generate coverage.html from coverage.out (run task coverage first)
    cmds:
      - |
        if [ ! -s coverage.out ]; then
          echo "coverage.out missing; run task coverage first" >&2
          exit 1
        fi
      - go tool cover -html=coverage.out -o coverage.html
      - echo "wrote coverage.html"

  e2e:
    desc: Run kind e2e smoke (setup, smoke, teardown — CI parity with e2e-nightly)
    env:
      CGO_ENABLED: "1"
      CLUSTER_NAME:
        sh: echo "${CLUSTER_NAME:-kollect-e2e}"
      KIND_CLUSTER_WAIT: 300s
      KOLLECT_HELM_TIMEOUT: 300s
      KOLLECT_MANAGER_WAIT: 300s
    cmds:
      - bash hack/kind/e2e/setup.sh
      - bash hack/kind/e2e/smoke.sh
      - defer: bash hack/kind/e2e/teardown.sh

  bench:
    desc: Run Go micro-benchmarks (-short, -benchmem); safe for dev/CI
    env:
      CGO_ENABLED: "1"
    cmds:
      - mkdir -p artifacts/bench
      - |
        stamp="$(date -u +%Y%m%dT%H%M%SZ)"
        out="artifacts/bench/${stamp}.txt"
        go test -short -bench=. -benchmem ./internal/collect/... 2>&1 | tee "$out"
        cp "$out" artifacts/bench/latest.txt
        echo "wrote $out"

  extract-budget:
    desc: >-
      Assert the extractor hot-path budget (ns/op, B/op, allocs/op vs a recorded
      baseline +25%). EXERCISES: collect.Extractor.Extract over 128 varied
      objects, single-threaded, in-process. Does NOT exercise an API server,
      cluster, informers, sinks, controller, concurrency or export — it is a
      micro-benchmark budget, not cluster-scale evidence. Also runs in task
      test:run. Override ceilings with KOLECT_EXTRACT_MAX_{NS,BYTES,ALLOCS}_PER_OP.
    env:
      CGO_ENABLED: "1"
      # This task runs the budget test ALONE and uninstrumented, so it can pin a
      # far tighter latency gate than the in-code default (which has to survive
      # the parallel, coverage-instrumented PR gate). 8x the S-LOCAL baseline of
      # 25551 ns/op: enough headroom for an unpinned GitHub runner, ~6x tighter
      # than the default. On calibrated hardware, set this to your own measured
      # ns/op x 1.25 for the real >25% regression gate.
      KOLECT_EXTRACT_MAX_NS_PER_OP: "204408"
    cmds:
      - go test -run TestExtractHotPathBudget -count=1 -v -timeout=10m ./internal/collect/...
