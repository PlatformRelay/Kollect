# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: "3"

set:
  - pipefail

run: once

env:
  GOTOOLCHAIN:
    sh: echo "go$(sed -n 's/^go //p' go.mod | head -1)"

tasks:
  run:
    desc: Run unit tests (excludes e2e; no race detector — use coverage:race locally)
    cmds:
      - make test

  coverage:
    desc: Unit/envtest with internal/ coverage.out and floor (COVERAGE_MIN, default 65)
    cmds:
      - bash hack/coverage.sh

  coverage:race:
    desc: Same as coverage with COVERAGE_RACE=1 (local + nightly advisory; requires CGO)
    env:
      CGO_ENABLED: "1"
      COVERAGE_RACE: "1"
    cmds:
      - bash hack/coverage.sh

  coverage:report:
    desc: Print go tool cover -func summary from coverage.out
    cmds:
      - |
        if [ ! -s coverage.out ]; then
          echo "coverage.out missing; run task coverage first" >&2
          exit 1
        fi
      - go tool cover -func=coverage.out | tee coverage-summary.txt

  coverage:html:
    desc: Generate coverage.html from coverage.out (run task coverage first)
    cmds:
      - |
        if [ ! -s coverage.out ]; then
          echo "coverage.out missing; run task coverage first" >&2
          exit 1
        fi
      - go tool cover -html=coverage.out -o coverage.html
      - echo "wrote coverage.html"

  e2e:
    desc: Run kind e2e smoke (setup, smoke, teardown — CI parity with e2e-nightly)
    env:
      CGO_ENABLED: "1"
      CLUSTER_NAME:
        sh: echo "${CLUSTER_NAME:-kollect-e2e}"
      KIND_CLUSTER_WAIT: 300s
      KOLLECT_HELM_TIMEOUT: 300s
      KOLLECT_MANAGER_WAIT: 300s
    cmds:
      - bash hack/kind/e2e/setup.sh
      - bash hack/kind/e2e/smoke.sh
      - defer: bash hack/kind/e2e/teardown.sh

  bench:
    desc: >-
      Run Go micro-benchmarks (-short, -benchmem); safe for dev/CI. Filters
      tests out with -run='^$' so a red TestExtractHotPathBudget cannot fail
      this task — use task extract-budget for the budget assertions.
    env:
      CGO_ENABLED: "1"
    cmds:
      - mkdir -p artifacts/bench
      - |
        stamp="$(date -u +%Y%m%dT%H%M%SZ)"
        out="artifacts/bench/${stamp}.txt"
        go test -short -bench=. -benchmem -run='^$' ./internal/collect/... 2>&1 | tee "$out"
        cp "$out" artifacts/bench/latest.txt
        echo "wrote $out"

  extract-budget:
    desc: >-
      Assert the extractor hot-path budget. ENFORCED as a >25% regression gate:
      B/op and allocs/op vs the recorded baseline (hardware-independent for a
      fixed toolchain). NOT enforced: a >25% wall-clock gate — the ns/op ceiling
      is only a coarse catastrophic-regression net, and a CPU-only slowdown at
      unchanged allocations can pass it. EXERCISES: collect.Extractor.Extract
      over 128 varied objects, single-threaded, in-process. Does NOT exercise an
      API server, cluster, informers, sinks, controller, concurrency or export —
      it is a micro-benchmark budget, not cluster-scale evidence. Also runs in
      task test:run. Override ceilings with
      KOLECT_EXTRACT_MAX_{NS,BYTES,ALLOCS}_PER_OP.
    env:
      # This task runs the budget test ALONE, so it can pin a tighter ns/op
      # ceiling than the in-code default (which must survive the parallel PR
      # gate). 8x the S-LOCAL baseline of 25551 ns/op: enough headroom for an
      # unpinned GitHub runner, ~6x tighter than the default — but still a
      # catastrophic-regression net, NOT a 25% gate. On calibrated hardware set
      # this to your own measured ns/op x 1.25 for a real latency floor.
      KOLECT_EXTRACT_MAX_NS_PER_OP: "204408"
    cmds:
      - go test -run TestExtractHotPathBudget -count=1 -v -timeout=10m ./internal/collect/...
