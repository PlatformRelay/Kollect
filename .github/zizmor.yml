# zizmor configuration (change ci-workflow-hardening, requirements CWS-1 and CWS-2).
#
# Every suppression listed under `rules:` is a deliberate, reviewed exception. A suppression is
# a list item under a rule's `ignore:` block; each such item MUST be preceded by a comment
# naming the audit id and why it is safe -- hack/test/ci_workflow_security_test.sh fails on an
# uncommented list item. A finding that the workflow can simply stop causing is fixed in the
# workflow, never listed here (for example, a language cache in a tag-triggered publish
# workflow is removed, not suppressed).
#
# The workflow-security job runs zizmor at `--min-severity=high` over `.github/`. At that
# threshold the one suppression below (dangerous-triggers, for the guarded CI failure reporter;
# change ci-failure-reporting, CFR-7) is the only finding silenced. Findings below the threshold
# are filtered by it, not suppressed here; the measured breakdown is recorded in
# ci-workflow-hardening's tasks.md so the threshold stays a visible decision rather than amnesia.
rules:
  # dangerous-triggers: default-branch code only, no checkout of the triggering run, no log
  # text evaluated, schedule and same-repository guard.
  dangerous-triggers:
    ignore:
      # dangerous-triggers: exception limited to the guarded CI failure reporter.
      - ci-failure-report.yaml
