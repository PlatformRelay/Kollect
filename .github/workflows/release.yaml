name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0); workflow_dispatch rebuilds assets for testing"
        required: true
        type: string
      draft:
        description: "Create/update the GitHub Release as a draft"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kollect
  PIPELINE_IMAGE_NAME: kollect-pipeline

jobs:
  # Read-only gate. Verifier scripts are loaded from the default branch so a
  # candidate tag cannot supply its own eligibility logic (AUD-SEC-02).
  eligibility:
    name: release eligibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      sha: ${{ steps.prove.outputs.sha }}
      tag: ${{ steps.prove.outputs.tag }}
      version: ${{ steps.prove.outputs.version }}
    steps:
      - name: Checkout trusted gate scripts from default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            hack/release
          sparse-checkout-cone-mode: true
          persist-credentials: false
          path: trusted-gate

      - name: Resolve tag SHA and prove reviewed-main eligibility
        id: prove
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must look like vX.Y.Z (got ${TAG})" >&2
            exit 1
          fi
          # Resolve via API (peels annotated tags). Do not trust a candidate checkout.
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          if [[ ! "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "failed to resolve ${TAG} to a full commit SHA" >&2
            exit 1
          fi
          bash trusted-gate/hack/release/verify-eligibility.sh "${SHA}"
          {
            echo "sha=${SHA}"
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
          } >> "${GITHUB_OUTPUT}"

  release:
    name: release
    needs: eligibility
    runs-on: ubuntu-latest
    # Require a protected "release" environment (required reviewers / wait timer)
    # so write credentials cannot be obtained by stripping the eligibility job from
    # a malicious tagged workflow copy alone.
    environment: release
    # contents: write — create/update GitHub Release assets (softprops/action-gh-release, git-cliff)
    # packages: write — push container image and OCI Helm chart to GHCR
    # id-token: write — cosign keyless signing via Sigstore OIDC
    # attestations: write — publish SLSA provenance to GH attestations API
    # artifact-metadata: write — registry storage records for attested images
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Bind publication to the immutable SHA proven by eligibility — never the
          # mutable tag ref alone.
          ref: ${{ needs.eligibility.outputs.sha }}

      - name: Confirm immutable publication SHA
        id: version
        env:
          EXPECT_SHA: ${{ needs.eligibility.outputs.sha }}
          TAG: ${{ needs.eligibility.outputs.tag }}
          VERSION: ${{ needs.eligibility.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GOT="$(git rev-parse HEAD)"
          if [[ "${GOT}" != "${EXPECT_SHA}" ]]; then
            echo "checked-out HEAD ${GOT} != eligibility SHA ${EXPECT_SHA}" >&2
            exit 1
          fi
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          if [[ "${TAG_SHA}" != "${EXPECT_SHA}" ]]; then
            echo "tag ${TAG} now resolves to ${TAG_SHA}, not proven SHA ${EXPECT_SHA}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}"
          echo "repository=${IMAGE}" >> "${GITHUB_OUTPUT}"
          # DR-FIND-07: push the controller image ONLY at the v-prefixed tag.
          # The bare "<version>" tag (e.g. :0.13.0) is intentionally omitted here
          # because the Helm chart is later `helm push`ed to the same OCI repo path
          # and occupies ghcr.io/<owner>/kollect:<version>. Publishing the image at
          # the bare tag too would let the chart clobber it, so default/bare-tag
          # pulls would get a chart artifact (CreateContainerConfigError).
          echo "tags=${IMAGE}:${{ steps.version.outputs.tag }}" >> "${GITHUB_OUTPUT}"

      - name: Build and push controller image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # DR-FIND-07: scan by digest — the bare "<version>" tag is no longer
          # published for the controller image (see the `image` step above).
          image-ref: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign container image
        run: |
          cosign sign --yes \
            "${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}"


      - id: pipeline-image
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER}/${{ env.PIPELINE_IMAGE_NAME }}"
          echo "repository=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "tags=${IMAGE}:${{ steps.version.outputs.version }},${IMAGE}:${{ steps.version.outputs.tag }}" >> "${GITHUB_OUTPUT}"

      - name: Build and push kollect-pipeline image
        id: pipeline-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.pipeline
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.pipeline-image.outputs.tags }}
          cache-from: type=gha,scope=kollect-pipeline
          cache-to: type=gha,mode=max,scope=kollect-pipeline
          sbom: true
          provenance: mode=max

      - name: Scan kollect-pipeline image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pipeline-image.outputs.repository }}:${{ steps.version.outputs.version }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Sign kollect-pipeline container image
        run: |
          cosign sign --yes \
            "${{ steps.pipeline-image.outputs.repository }}@${{ steps.pipeline-build.outputs.digest }}"

      - name: Prepare dist directory
        run: mkdir -p dist

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
          output-file: dist/sbom.spdx.json
          format: spdx-json
          registry-username: ${{ github.repository_owner }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}


      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.pipeline-image.outputs.repository }}@${{ steps.pipeline-build.outputs.digest }}
          output-file: dist/sbom-pipeline.spdx.json
          format: spdx-json
          registry-username: ${{ github.repository_owner }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest operator image (SLSA provenance)
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest operator image (SBOM)
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: dist/sbom.spdx.json
          push-to-registry: true


      - name: Attest kollect-pipeline image (SLSA provenance)
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.pipeline-image.outputs.repository }}
          subject-digest: ${{ steps.pipeline-build.outputs.digest }}
          push-to-registry: true

      - name: Attest kollect-pipeline image (SBOM)
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.pipeline-image.outputs.repository }}
          subject-digest: ${{ steps.pipeline-build.outputs.digest }}
          sbom-path: dist/sbom-pipeline.spdx.json
          push-to-registry: true

      - name: Build release assets
        run: bash hack/release-assets.sh "${{ steps.version.outputs.version }}" "${{ steps.image.outputs.repository }}"

      - name: Sign GitHub Release assets
        run: bash hack/sign-release-assets.sh dist

      - name: Attest GitHub Release assets (SLSA provenance)
        id: attest-release
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: dist/checksums.txt

      - name: Export release provenance bundle
        run: cp "${{ steps.attest-release.outputs.bundle-path }}" dist/release-provenance.intoto.jsonl

      - id: chart
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "oci=oci://${{ env.REGISTRY }}/${OWNER}" >> "${GITHUB_OUTPUT}"

      - name: Publish and sign Helm chart (OCI)
        id: chart-publish
        run: |
          set -euo pipefail
          CHART_PKG="dist/kollect-${{ steps.version.outputs.version }}.tgz"
          PUSH_OUT="$(helm push "${CHART_PKG}" "${{ steps.chart.outputs.oci }}" 2>&1)"
          echo "$PUSH_OUT"
          DIGEST="$(echo "$PUSH_OUT" | awk '/Digest:/{print $2; exit}')"
          if [[ -z "${DIGEST}" ]]; then
            echo "failed to extract chart digest from helm push output" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          CHART_REF="${{ env.REGISTRY }}/${OWNER}/kollect@${DIGEST}"
          echo "Signing ${CHART_REF}"
          cosign sign --yes "${CHART_REF}"

      - name: Guard against image/chart GHCR tag collision (DR-FIND-07)
        env:
          IMAGE_REPO: ${{ steps.image.outputs.repository }}
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart-publish.outputs.digest }}
        run: |
          set -euo pipefail
          # DR-FIND-07 regression guard. The chart is helm-pushed to the SAME OCI
          # repo path as the controller image and occupies the bare "<version>" tag
          # (ghcr.io/<owner>/kollect:<version>). If the controller image were ever
          # published at that bare tag again, the chart would clobber the runnable
          # image and default/bare-tag pulls would fail with CreateContainerConfigError.
          #
          # (1) Primary guard: the controller image tag list must NOT contain the
          #     bare "<repo>:<version>" tag path the chart owns. This is the real
          #     collision condition (a shared tag path between two artifacts) and
          #     uses only values already produced by the workflow — no crane/oras.
          BARE_TAG="${IMAGE_REPO}:${VERSION}"
          if printf '%s' "${IMAGE_TAGS}" | tr ',' '\n' | grep -Fxq "${BARE_TAG}"; then
            echo "DR-FIND-07: controller image is tagged ${BARE_TAG}, which the Helm chart occupies on GHCR — the chart would clobber the runnable image. Publish the image at the v-prefixed tag only." >&2
            exit 1
          fi
          # (2) Sanity compare: the image manifest digest and the chart OCI manifest
          #     digest must differ. These are always distinct artifact types, so this
          #     is a belt-and-suspenders check, NOT the primary collision detector.
          if [[ "${IMAGE_DIGEST}" == "${CHART_DIGEST}" ]]; then
            echo "DR-FIND-07: controller image digest equals chart digest (${IMAGE_DIGEST}) — the same artifact was published for both." >&2
            exit 1
          fi
          echo "DR-FIND-07 guard passed: image tags='${IMAGE_TAGS}' do not include the chart's bare tag '${BARE_TAG}'; image/chart digests differ."

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          version: v2.13.1
          config: hack/release/cliff.toml
          args: --latest --strip header
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble release notes
        env:
          CLIFF_CHANGELOG: ${{ steps.cliff.outputs.content }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          IMAGE_REPO: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PIPELINE_IMAGE_REPO: ${{ steps.pipeline-image.outputs.repository }}
          PIPELINE_IMAGE_DIGEST: ${{ steps.pipeline-build.outputs.digest }}
          CHART_OCI: ${{ steps.chart.outputs.oci }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x hack/assemble-release-notes.sh
          printf '%s\n' "${CLIFF_CHANGELOG}" >"${RUNNER_TEMP}/changelog.md"
          CHANGELOG_SECTION="${RUNNER_TEMP}/changelog.md" \
            bash hack/assemble-release-notes.sh "${RUNNER_TEMP}/release-body.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: kollect ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/release-body.md
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: |
            dist/install-crds.yaml
            dist/install.yaml
            dist/kollect-${{ steps.version.outputs.version }}.tgz
            dist/sbom.spdx.json
            dist/sbom-pipeline.spdx.json
            dist/checksums.txt
            dist/release-provenance.intoto.jsonl
            dist/*.sigstore.json

      # Artifact Hub repository metadata is pure discoverability: it must never gate
      # the core publish. Both steps therefore run AFTER "Publish GitHub Release" and
      # are soft-fail (ADR-0708: "soft-fail hub jobs preserve tag-release success").
      # Before this ordering, an oras download/login/push failure aborted the job
      # after the images and chart were already pushed and cosign-signed, leaving a
      # tag with signed GHCR artifacts but no GitHub Release and none of its assets.
      - name: Set up oras
        id: setup-oras
        continue-on-error: true
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2 (includes 1.3.2)
        with:
          version: "1.3.2"

      - name: Push Artifact Hub metadata
        id: push-artifacthub-metadata
        continue-on-error: true
        if: ${{ steps.setup-oras.outcome == 'success' }}
        # Secrets and untrusted GitHub contexts are passed through `env:` and
        # referenced as shell variables; expanding them inline in the `run:`
        # body would leak the token into the rendered script and open a script
        # injection path (githubactions:S7636).
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "${REGISTRY_PASSWORD}" | oras login "${REGISTRY}" \
            --username "${REGISTRY_USER}" --password-stdin
          oras push \
            "${REGISTRY}/${OWNER}/${IMAGE_NAME}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Report Artifact Hub metadata push outcome
        if: ${{ always() }}
        # Soft-fail must not mean invisible. `continue-on-error` forces
        # steps.<id>.conclusion to "success", so the real result is only readable
        # from steps.<id>.outcome — surface it as an annotation plus a job-summary
        # line so a failed push is obvious without opening the logs.
        env:
          SETUP_OUTCOME: ${{ steps.setup-oras.outcome }}
          PUSH_OUTCOME: ${{ steps.push-artifacthub-metadata.outcome }}
        run: |
          set -euo pipefail
          if [[ "${SETUP_OUTCOME}" == "success" && "${PUSH_OUTCOME}" == "success" ]]; then
            echo "- Artifact Hub repository metadata pushed (\`:artifacthub.io\`)." \
              >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo "::warning title=Artifact Hub metadata not published::oras setup=${SETUP_OUTCOME}, push=${PUSH_OUTCOME}. The release itself is unaffected; re-run the Artifact Hub push manually or on the next tag."
          {
            echo "- :warning: **Artifact Hub repository metadata was NOT published**"
            echo "  (oras setup: \`${SETUP_OUTCOME}\`, push: \`${PUSH_OUTCOME}\`)."
            echo "  Discoverability only — the release, its assets and signatures are unaffected."
          } >>"${GITHUB_STEP_SUMMARY}"

  operatorhub-pr:
    name: OperatorHub PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && github.event_name == 'push' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate OLM bundle and create OperatorHub PRs
        continue-on-error: true
        env:
          VERSION: ${{ needs.release.outputs.version }}
          IMAGE_DIGEST: ${{ needs.release.outputs.digest }}
          GH_TOKEN: ${{ secrets.OPERATORHUB_PAT }}
          FORK_OWNER: platformrelay
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "OPERATORHUB_PAT not configured; skipping OperatorHub submission."
            exit 0
          fi
          chmod +x hack/operatorhub-pr.sh
          hack/operatorhub-pr.sh
