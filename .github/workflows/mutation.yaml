# MUT-1 to MUT-4 (openspec change mutation-testing-signal): a nightly mutation measurement of
# internal/aggregate, internal/redact and internal/pathvalidate, report only. `task mutation`
# installs the pinned gremlins and runs hack/ci/mutation.sh, which first proves on a fixture module
# that a surviving mutant is seen, then writes killed, lived, not covered, timed out and not viable
# counts per package to the job summary. A low score never fails the run; a tool failure, a
# missing report or a broken fixture control always does. The reports are uploaded either way.
# A failed scheduled run is reported by ci-failure-report.yaml, which lists this workflow by name.
# MUTATION_FORCE_FAILURE (a repository variable) only fails the run, to prove that report.
# Pinned by hack/test/mutation_signal_test.sh (W1).
name: Mutation testing

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    # why: gremlins takes about 9 s for the fixture and the three packages (task 1.1); the rest is
    # checkout, Go setup and building gremlins, a few minutes cold. 15 bounds a hung run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/go-cache

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0

      - name: Mutation measurement (report only)
        id: mutation
        env:
          MUTATION_FORCE_FAILURE: ${{ vars.MUTATION_FORCE_FAILURE }}
        run: task mutation

      - name: Upload the gremlins reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-reports
          path: ${{ steps.mutation.outputs.reports }}
          if-no-files-found: error
