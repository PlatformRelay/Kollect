name: changelog-sync

# Self-healing CHANGELOG.md sync.
#
# Why this exists: git-cliff renders each [Unreleased] entry with the commit's
# SHA (hack/release/cliff.toml). Every squash/rebase merge assigns a NEW SHA that
# the pre-merge CHANGELOG.md cannot know, so `task changelog:verify` drifts and
# CHANGELOG.md drifts on main after any user-facing (feat/fix/perf/refactor) merge.
# (test/docs/ci/chore/build/style commits are cliff-skipped and never drift.)
# This workflow regenerates CHANGELOG.md after each push to main and commits the
# result, so those merges self-heal instead of needing a manual post-merge sync.
#
# ACTIVATION (operator): pushing to `main` is gated by the `protect-main` ruleset
# ("changes must be made through a pull request"). `github-actions[bot]` / the
# default `GITHUB_TOKEN` cannot be a ruleset bypass actor — GitHub only allows
# Users, Teams, Roles, and Integrations (GitHub Apps) on ruleset bypass lists.
#
# Bypass (done): Integration App ID 4389790 is on `protect-main` with
# bypass_mode: always.
#
# Secrets (repo): mint an installation token with
#   CHANGELOG_SYNC_GITHUB_APP_ID
#   CHANGELOG_SYNC_GITHUB_APP_PRIVATE_KEY
# (App private key PEM — Client ID/Secret alone cannot mint installation tokens.)
# Until both secrets are set and the push succeeds, the push step soft-fails with
# a warning (this workflow is NOT a required check, so it never blocks a merge).
#
# RELEASE GUARD (hack/check-changelog-release-guard.sh): docs/RELEASE.md lands the
# hand-written `## [X.Y.Z]` header on main BEFORE the vX.Y.Z tag is pushed. This
# workflow fires on that push, so git-cliff sees no tag and re-renders the section
# as `## [Unreleased]` — which is how bot commit fbb5196a3 demoted `## [0.17.0]`
# and turned Docs CI red on every open PR. Every regeneration is therefore diffed
# against the committed CHANGELOG.md before anything is pushed:
#   • nothing lost                → commit & push (normal self-healing)
#   • top section demoted and its
#     tag not visible yet         → release in flight: ::warning, no push, job
#                                   stays green. The file is left as committed and
#                                   the next push to main after the tag lands
#                                   regenerates it correctly. (A tag push alone
#                                   does not re-trigger this workflow.)
#   • any other released section
#     disappears                  → ::error and the job FAILS. Nothing is pushed.
#                                   Still not a required check, so it blocks no
#                                   merge — but it is red and loud on main.
# The guard only ever inspects `## [X.Y.Z]` version tokens, so ordinary
# [Unreleased] drift-healing (the reason this workflow exists) is untouched.

on:
  push:
    branches: [main]
    # Loop guard: the sync commit only touches CHANGELOG.md, so ignoring it here
    # prevents this workflow from re-triggering itself.
    paths-ignore:
      - "CHANGELOG.md"

# Read-only baseline (OpenSSF Scorecard "Token-Permissions"). The write grant is
# scoped to the `sync` job below — the only job that commits/pushes CHANGELOG.md.
permissions:
  contents: read

concurrency:
  group: changelog-sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commits & pushes the regenerated CHANGELOG.md back to main
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.CHANGELOG_SYNC_GITHUB_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_SYNC_GITHUB_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff needs full history + tags
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.51.1
      - name: Regenerate CHANGELOG.md
        run: task changelog:write
        env:
          CI: "true"
      - name: Guard against dropping a released section
        id: guard
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "::notice title=changelog-sync::CHANGELOG.md already in sync — nothing to do."
            echo "verdict=in-sync" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          committed="${RUNNER_TEMP}/changelog-committed.md"
          git show HEAD:CHANGELOG.md > "${committed}"
          rc=0
          bash hack/check-changelog-release-guard.sh "${committed}" CHANGELOG.md || rc=$?
          case "${rc}" in
            0) echo "verdict=push" >> "${GITHUB_OUTPUT}" ;;
            2) echo "verdict=hold" >> "${GITHUB_OUTPUT}" ;;
            *) exit 1 ;; # released section lost (or usage error) — fail loudly, push nothing
          esac
      - name: Commit & push if drifted
        if: steps.guard.outputs.verdict == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # [skip ci] keeps App-token pushes from re-triggering workflows; paths-ignore
          # is the primary loop guard when only CHANGELOG.md changes.
          git commit -m ":page_facing_up: docs: sync CHANGELOG.md [skip ci]"
          if git push origin HEAD:main; then
            echo "::notice title=changelog-sync::Pushed regenerated CHANGELOG.md to main."
          else
            echo "::warning title=changelog-sync::Could not push CHANGELOG.md — ensure CHANGELOG_SYNC_GITHUB_APP_ID + CHANGELOG_SYNC_GITHUB_APP_PRIVATE_KEY are set and Integration 4389790 remains a protect-main bypass actor (always). CHANGELOG.md remains drifted until then."
          fi
