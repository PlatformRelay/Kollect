# Docs site (https://platformrelay.github.io/Kollect/) — deploy from main only, not release tags.
# Path-filtered on PR/push; manual workflow_dispatch for on-demand rebuilds.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "SECURITY.md"
      - "osv-scanner.toml"
      - "CHANGELOG.md"
      - "api/v1alpha1/**"
      - "config/crd/bases/**"
      - "config/samples/**"
      - "hack/docs/**"
      - "hack/test/docs_launch_truth_test.sh"
      - "hack/test/security_architecture_docs_test.sh"
      - "hack/test/ui_removal_reference_test.sh"
      - "hack/test/hyg_ui_gitignore_test.sh"
      - "test/docs/**"
      - "Taskfile.yml"
      - "charts/kollect/Chart.yaml"
      - "charts/kollect/README.md"
      - "overrides/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "SECURITY.md"
      - "osv-scanner.toml"
      - "CHANGELOG.md"
      - "api/v1alpha1/**"
      - "config/crd/bases/**"
      - "config/samples/**"
      - "hack/docs/**"
      - "hack/test/docs_launch_truth_test.sh"
      - "hack/test/security_architecture_docs_test.sh"
      - "hack/test/ui_removal_reference_test.sh"
      - "hack/test/hyg_ui_gitignore_test.sh"
      - "test/docs/**"
      - "Taskfile.yml"
      - "charts/kollect/Chart.yaml"
      - "charts/kollect/README.md"
      - "overrides/**"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

# Explicit top-level read-only baseline (OpenSSF Scorecard "Token-Permissions"
# flags workflows with no top-level `permissions:`). Each job below still
# declares only what it needs (least privilege, job-scoped per SonarCloud rule /
# KO-06); job-level blocks override this baseline where a job needs more.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build docs
    runs-on: ubuntu-latest
    env:
      DOCS_REQUIRE_CHROME: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: "pip install --require-hashes --only-binary=:all: -r docs/requirements-docs.txt"

      - name: Select preinstalled Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [[ -z "${chrome}" ]]; then
            echo "A preinstalled Chrome/Chromium binary is required for the docs layout regression." >&2
            exit 1
          fi
          echo "CHROME_BIN=${chrome}" >> "${GITHUB_ENV}"

      - name: Verify documentation
        run: task docs:verify

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
