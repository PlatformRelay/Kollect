# Self-hosted Renovate (openspec change dependency-update-automation, DUA-1 to DUA-3, DUA-7,
# DUA-8). It runs hourly, one run at a time, under the maintainer's RENOVATE_TOKEN secret only:
# a pull request opened by the workflow's own token never starts CI, so a missing secret fails
# the job before Renovate starts instead of falling back. The job token is read-only; Renovate
# writes with RENOVATE_TOKEN. The Renovate image is pinned by version and digest and bumped by
# its own weekly, never auto-merged PR (renovate.json). hack/test/renovate_policy_test.sh guards
# this file; hack/ci/renovate-config-validate.sh validates the configs from the same image.
name: Renovate

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RENOVATE_REPOSITORIES: ${{ github.repository }}
      # Manual runs emit debug logs.
      LOG_LEVEL: ${{ github.event_name == 'workflow_dispatch' && 'debug' || '' }}
    steps:
      - name: Require RENOVATE_TOKEN
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "${RENOVATE_TOKEN}" ]; then
            echo "::error::RENOVATE_TOKEN is not set: add the repository secret, Renovate does not run without it" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          configurationFile: .github/renovate-config.json
          renovate-image: ghcr.io/renovatebot/renovate:44.206.2@sha256:d515a99f5d14d1c62b792ee61339d165dd9d20ee82ca9d5379daf639050bab51
          token: ${{ secrets.RENOVATE_TOKEN }}
