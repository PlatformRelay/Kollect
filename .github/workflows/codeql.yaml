name: CodeQL

# Runs on every push/PR to main (no paths-ignore) so OpenSSF Scorecard SAST
# sees CodeQL on all recent commits. Docs-only PRs pay a short Go CodeQL run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "18 6 * * 1"

permissions:
  actions: read
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  # HY-06: never cancel in-flight runs on main (would leave CI-UNKNOWN); PR runs still supersede.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/go-cache

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: go

      - name: Build for CodeQL
        run: go build -mod=readonly ./...

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:go"
