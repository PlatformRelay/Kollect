name: Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff changelog:verify needs tags and full history
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/go-cache
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.51.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Lint Markdown
        run: task lint:markdown
      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.sum
      - name: Verify go.sum checksums
        run: go mod verify
      - name: Verify generated artifacts
        run: task verify
        env:
          CI: "true"
      # NOTE: `task changelog:verify` is deliberately NOT gated here. git-cliff
      # embeds each [Unreleased] entry's commit SHA (hack/release/cliff.toml), and
      # rebase-merges reassign SHAs, so the check ALWAYS drifts on the merge commit
      # and on PRs. The self-healing changelog-sync workflow owns CHANGELOG.md
      # correctness; gating it here only produced a permanently-red badge (the
      # healed commit is paths-ignored, so preflight could never re-run to clear
      # it). Run `task changelog:verify` locally instead. See decisions log
      # (2026-07-30). Do NOT re-add this step.
      - name: Perf-report preflight note
        run: |
          echo "::notice title=perf-report::Run task perf-report locally before scale or perf work (ADR-0603). Optional CI job perf-report runs the same gate without blocking merge."
