# TDS-2 (openspec change test-depth-signals): every unit package three times under one -shuffle
# seed, nightly, so a test that depends on test order or on running once per process surfaces.
# hack/ci/test-shuffle.sh picks a fresh seed each run and prints it before any test; the log's
# reproduce line reruns it locally. No seed is set here, so each night tries a new order.
# A failed scheduled run is reported by ci-failure-report.yaml, which lists this workflow by name.
# Pinned by hack/test/test_shuffle_test.sh (S11, S12).
name: Test shuffle

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-shuffle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-shuffle:
    name: test-shuffle
    runs-on: ubuntu-latest
    # why: three passes of the unit + envtest suite; CI's one-pass test-suite job takes about
    # 8 minutes (task 2.1 evidence), so 45 leaves about twice the expected time.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/go-cache
        with:
          envtest: true

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0

      - name: Shuffled, repeated unit tests (seed printed first)
        run: task test:shuffle
