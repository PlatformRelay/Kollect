# CI path filter matrix (see docs/development/testing.md):
# - Any change under api/, internal/, charts/, cmd/, config/, hack/, test/, go.mod, or
#   .github/workflows/ runs full CI. Mixed PRs (docs + code) run everything.
# - A documentation-only change (docs/**, mkdocs.yml, README.md, CHANGELOG.md,
#   CONTRIBUTING.md, LICENSE, issue templates) skips the expensive jobs; other root Markdown
#   files still run full CI. The Docs workflow runs lint-markdown + MkDocs build/deploy for
#   its path-scoped inputs.
#
# CI-DOCSGATE-01: on `pull_request` that decision is made by the `changes` job below, NOT by a
# `paths-ignore` filter. protect-main requires the context `test` from this workflow, and a
# workflow skipped by `paths-ignore` does not report its contexts as skipped -- it does not
# report them at all. Every docs-only PR therefore sat at mergeStateStatus BLOCKED with a
# SUCCESS rollup and an empty failure list, and only `gh pr merge --admin` or the web UI's
# bypass prompt got through (PR #350, 2026-09-01; PR #321, 2026-08-23). A bypass required on
# every docs PR is the merge path, not an exception, and it trains the reflex that one day
# waves through a genuinely red required check.
#
# The `test` job at the bottom is now a REPORT: it runs `if: always()` so the required context
# always reaches a conclusion, and it fails unless `test-suite` actually succeeded whenever the
# PR touches anything outside the documentation path set. `paths-ignore` stays on `push`, where
# no required context is at stake. Locked by hack/test/ci_docs_gate_test.sh.
#
# The docs-only path is NOT free, and that is a deliberate trade. Where this workflow previously
# was not dispatched at all, a documentation-only PR now runs `changes`, `gitleaks` and `lint` --
# `lint` because two existing gates (dist_ci_wiring_test.sh, repo_root_links_wiring_test.sh)
# require it to be unconditional, and because it is where ci_docs_gate_test.sh runs, so leaving
# it ungated is the only thing that exercises the docs-only direction at all. What such a PR no
# longer pays for is the Go suite, the kind clusters, testcontainers, the fuzz matrix and the
# image builds -- and it no longer needs a ruleset bypass to merge.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:

permissions:
  contents: read

jobs:
  # CI-DOCSGATE-01: the per-PR verdict every expensive job below hangs off. `code=true` means
  # the change touches something other than documentation. Fail-safe in one direction only:
  # anything this job cannot classify (a non-PR event, a missing or unreachable SHA, an empty
  # diff) yields `true`, so the worst case is a wasted CI run rather than a required context
  # reported green without having run.
  #
  # That claim is only true because the diff is taken with `--no-renames`; see the step body.
  # A verdict is a claim about the WHOLE diff, so the classifier must see deletions and both
  # halves of a rename, not just the paths that still exist -- the gate covers each of those
  # with a real `git rm` / `git mv` case.
  #
  # Keep the `filter` step body byte-identical with the one in .github/workflows/e2e-smoke.yaml
  # -- hack/test/ci_docs_gate_test.sh compares them, because two copies that drift are two
  # different answers to "is this docs-only?" and `test` and `kind-smoke` would then disagree
  # about the same PR.
  changes:
    name: changes (ci)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # `fetch-depth: 0` is required, not defensive: BASE_SHA is the base branch tip at event
      # time and can be an arbitrary ancestor, and a shallow clone has neither it nor a
      # merge base, so `git diff` would fail. That fails CLOSED (code=true), which is safe but
      # would silently run full CI on every PR and destroy the point of this job. `filter:
      # blob:none` keeps that full commit history while skipping the file contents -- a
      # `--name-only --no-renames` diff compares tree entries by object id and never reads a
      # blob -- so this costs a blobless clone, not a full one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # The documentation path set. Mirrors the `paths-ignore` list kept on `push` above.
          docs_only_path() {
            case "$1" in
            docs/* | mkdocs.yml | README.md | CHANGELOG.md | CONTRIBUTING.md | LICENSE | .github/ISSUE_TEMPLATE/*)
              return 0
              ;;
            *)
              return 1
              ;;
            esac
          }

          emit() {
            echo "code=$1" >>"${GITHUB_OUTPUT}"
            echo "changed-code=$1"
          }

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            emit true
            exit 0
          fi
          if [ -z "${BASE_SHA}" ] || [ -z "${HEAD_SHA}" ]; then
            emit true
            exit 0
          fi
          # `--no-renames` is load-bearing, not tidiness. Rename detection is ON by default
          # (diff.renames since git 2.9) and `git diff --name-only` then prints ONLY the
          # DESTINATION of a detected rename. Without it, `git mv internal/x.go docs/x.go`
          # reports the single path `docs/x.go`, this job answers "documentation-only", and
          # both reporters report green for a change that deleted a Go file from the tree.
          # With `--no-renames` the same diff reports both paths, and the loop below sees the
          # source. Locked by hack/test/ci_docs_gate_test.sh (rename-into-docs case + mutant).
          # `core.quotepath` is left at its default, so a path containing non-ASCII, a newline or
          # a tab comes back C-quoted and matches no documentation pattern below -- that change
          # gets full CI. Wasteful, but it is the safe direction, so it is left alone.
          if ! changed="$(git diff --name-only --no-renames "${BASE_SHA}" "${HEAD_SHA}" 2>/dev/null)"; then
            emit true
            exit 0
          fi
          if [ -z "${changed}" ]; then
            emit true
            exit 0
          fi
          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            if ! docs_only_path "${file}"; then
              emit true
              exit 0
            fi
          done <<<"${changed}"
          emit false

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          bash hack/install-gitleaks.sh "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Scan repository
        run: gitleaks detect --source . --config .github/gitleaks.toml --verbose --redact --no-git

  verify:
    name: verify
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.51.1
      - name: Verify generated artifacts
        run: task verify
        env:
          CI: "true"

  audit-rbac:
    name: audit-rbac
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: RBAC security audit (Polaris + kubeaudit)
        run: bash hack/audit-rbac.sh
        env:
          POLARIS_VERSION: "9.6.0"
          KUBEAUDIT_VERSION: "0.22.2"

  vulncheck:
    name: vulncheck
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.51.1
      - name: govulncheck
        run: task vulncheck

  # lint job runs `task lint` → golangci-lint v2 (depguard, gomodguard, …) + go-arch-lint
  # (internal/ package graph; see .go-arch-lint.yml). No separate arch-lint step needed.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.51.1
      - name: Check formatting
        run: task format:check
      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
        run: |
          bash hack/install-shellcheck.sh "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Lint shell scripts
        run: task lint:shell
      - name: Verify scanner download checksums (unit + negative)
        run: |
          bash hack/test/verify-sha256_test.sh
          bash hack/test/install-checksum-negative_test.sh
      - name: Verify demo-up/demo-down task aliases
        run: bash hack/test/demo_task_aliases_test.sh
      - name: Verify default samples are credential-free (DEMO-01)
        run: bash hack/test/demo_01_default_samples_test.sh
      - name: Verify demo sample Kustomizations render (DOC-04)
        run: bash hack/test/demo_04_samples_kustomize_test.sh
      # CI-FETCHLIB-01: the shared fetch helper (hack/lib/fetch.sh) that every hack/install-*.sh
      # and the kind-e2e-setup action now download through. It gets its OWN step rather than being
      # invoked from the CI-HELMDL-01 gate below, which is how it first reached CI: that route was
      # circular (delete the nested call and this gate silently stops running) and it filed every
      # fetch-lib failure under a step named "install-helm hardening". Not matched by the dist_* or
      # sonar_ko_* globs, hence the explicit run. It goes BEFORE the install-helm gate because
      # install-helm's hardening is now a property of the helper, so "the helper is broken" is the
      # more fundamental diagnosis and the one an operator should read first.
      - name: Verify shared fetch helper hardening (CI-FETCHLIB-01)
        run: bash hack/test/ci_fetch_lib_hardening_test.sh
      # CI-HELMDL-01: hack/install-helm.sh is what the kind-e2e-setup composite action runs to
      # get helm, and a single transient `curl: (7)` to get.helm.sh reddened the REQUIRED
      # kind-smoke check on PR #351. This gate locks in the retry/protocol-pinning hardening
      # without letting it erode the SHA256 verification. It runs BEFORE the Install Helm step
      # below, so a broken installer is reported as a gate failure rather than as a mystery
      # download error. Not matched by the dist_* or sonar_ko_* globs, hence the explicit run.
      - name: Verify install-helm download hardening (CI-HELMDL-01)
        run: bash hack/test/ci_install_helm_hardening_test.sh
      - name: Install Helm
        env:
          HELM_VERSION: v3.21.4
        run: bash hack/install-helm.sh
      - name: Ensure yq is available
        run: |
          # ubuntu-latest images generally ship yq, but don't assume it --
          # some sonar_ko_* meta-tests (chart-rendering ones) need it.
          command -v yq >/dev/null 2>&1 || sudo snap install yq
          yq --version
      # DIST-OH-02: dist_olm_bundle_test.sh hard-requires operator-sdk for the OperatorHub
      # validator gate (operatorhubv2 / capabilities / categories). Installing it here is what
      # makes that gate actually run in CI instead of skipping -- a skipped gate would read as
      # coverage that does not exist. The gate resolves ./bin/operator-sdk first, so install there.
      - name: Install operator-sdk (OLM bundle validators)
        env:
          OPERATOR_SDK_VERSION: v1.42.3
        run: bash hack/install-operator-sdk.sh ./bin
      - name: Verify nightly advisory race job contract (HY-07)
        run: bash hack/test/hyg_07_nightly_race_test.sh
      - name: Verify manager RBAC grants core Events (not events.k8s.io)
        run: bash hack/test/core_events_rbac_test.sh
      - name: Verify manager RBAC can read KollectClusterScope
        run: bash hack/test/cluster_scope_rbac_test.sh
      - name: Verify changelog-sync release guard (fbb5196a3 regression lock)
        run: bash hack/test/changelog_sync_release_guard_test.sh
      # LAB-DEKIND: this suite is the enforcement mechanism for the lab substrate allowlist
      # (default-deny on kube contexts) and the non-Kind image-delivery policy. It was only
      # reachable via hack/docs/verify.sh in the path-filtered docs workflow, whose filter
      # does not include hack/lab/** — so a change to the harness itself never triggered it.
      # Run it here, unconditionally, where the guard actually protects something.
      - name: Lab harness offline meta-tests (substrate allowlist, image delivery, pprof)
        run: bash hack/test/lab_harness_meta_suite.sh
      # CI-CONTRIBFILTER-01: same shape as LAB-DEKIND above. This gate resolves relative links in
      # the repo-ROOT Markdown (README.md, CONTRIBUTING.md), which `mkdocs build --strict` cannot
      # see -- it reads only `docs_dir: docs`. It was reachable only via hack/docs/verify.sh in the
      # path-filtered Docs workflow, whose filter listed neither CONTRIBUTING.md nor this gate
      # script, so a PR weakening or deleting the gate triggered nothing that would notice.
      # hack/** is not in this workflow's paths-ignore, so running it here closes that half.
      # The CONTRIBUTING.md half cannot be closed here -- CONTRIBUTING.md is in paths-ignore
      # above -- and is closed by the docs.yaml filter entry instead.
      - name: Verify repo-root Markdown links resolve (CI-CONTRIBFILTER-01)
        run: bash hack/test/repo_root_links_test.sh
      - name: Verify the repo-root link gate stays wired into a job that runs
        run: bash hack/test/repo_root_links_wiring_test.sh
      # Mirrors the "Ensure yq is available" step above, for the same reason: the lint job
      # otherwise installs only Go tooling and shellcheck. hack/gen-glossary.py parses the CRD
      # YAML with PyYAML, and the gate below runs it, so a missing module would red the job for
      # a reason that has nothing to do with the glossary.
      - name: Ensure PyYAML is available
        run: |
          if ! python3 -c "import yaml" 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y python3-yaml
          fi
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
      # GLOSSARY-MARKER-01, same defect class as LAB-DEKIND above. This gate regenerates
      # docs/GLOSSARY.md and diffs it, so it is the only thing standing between a contributor
      # running the documented regeneration command and the curated rows inside the AUTO-CRD
      # markers being silently overwritten. Composing it into hack/docs/verify.sh alone left it
      # unreachable for its own motivating change class: the Docs workflow path filter lists
      # sibling hack/test scripts individually, so a commit touching only hack/gen-glossary.py
      # -- which is exactly what 2eef5a453 was -- triggered no run at all, and neither did an
      # edit to the gate itself. Run it here, unconditionally, next to the sonar_ko_* glob that
      # already carries the other hack/gen-glossary.py check.
      - name: Glossary generator drift meta-tests (AUTO-CRD block, curated rows, emitted links)
        run: bash hack/test/glossary_drift_test.sh
      # DOC-MAP-01: same shape as LAB-DEKIND and CI-CONTRIBFILTER-01 above. This gate asserts the
      # label-to-page contract of the Documentation map in docs/index.md -- that no label names a
      # deleted page, no two labels claim one page, and every label matches its destination's nav
      # label or H1. `mkdocs build --strict` structurally cannot catch this: the stale links all
      # RESOLVED, they just misinformed, and a link checker only sees resolution.
      # The gate would otherwise be reachable only via hack/docs/verify.sh in the path-filtered
      # Docs workflow, so a PR weakening or deleting the gate SCRIPT would trigger nothing that
      # notices. hack/** is not in this workflow's paths-ignore, so running it here closes that
      # half; docs.yaml's docs/** filter covers a change to the map itself.
      - name: Verify the docs map labels the pages it points at (DOC-MAP-01)
        run: bash hack/test/docs_map_contract_test.sh
      # DEV-MISE-01: mise.toml restates the task/node/python versions this job installs, and a
      # restated literal with no mechanism behind it is how release.yaml reached helm v3.21.4
      # while CI stayed on v3.17.3 (see renovate.json's own comment). Renovate's go-task manager
      # scans only .github/(actions|workflows)/, and nothing at all manages the node-version /
      # python-version inputs, so this comparison is the only thing that would notice. Run it
      # here, unconditionally: mise.toml and hack/** are both outside this workflow's
      # paths-ignore, so every change class that can break the contract triggers this job.
      - name: Verify mise.toml has not drifted from the CI pins (DEV-MISE-01)
        run: bash hack/test/dev_mise_pin_drift_test.sh
      # CI-DOCSGATE-01: asserts that all four required contexts (preflight, test, kind-smoke,
      # Analyze (Go)) report a conclusion on EVERY PR, and that the no-op reporting path cannot
      # stand in for the real job when code changed. It runs here because `lint` is the one job
      # in this workflow that is deliberately NOT gated on the changes verdict, so this gate
      # also runs on the docs-only PRs whose direction it protects -- which no PR touching
      # .github/** can ever exercise. Not matched by the dist_* or sonar_ko_* globs, hence the
      # explicit step; it needs the yq installed above.
      - name: Verify every required context reports on a docs-only PR (CI-DOCSGATE-01)
        run: bash hack/test/ci_docs_gate_test.sh
      - name: Run Sonar SECURITY remediation meta-tests
        run: |
          shopt -s nullglob
          scripts=(hack/test/sonar_ko_*_test.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no hack/test/sonar_ko_*_test.sh scripts yet"
          fi
          for script in "${scripts[@]}"; do
            echo "::group::${script}"
            bash "${script}"
            echo "::endgroup::"
          done
      - name: Hub distribution meta-tests
        run: |
          shopt -s nullglob
          scripts=(hack/test/dist_*_test.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no hack/test/dist_*_test.sh scripts yet"
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "::group::${script}"
            bash "${script}"
            echo "::endgroup::"
          done
      - name: Lint
        run: task lint

  # CI-DOCSGATE-01: the REAL suite. It is deliberately NOT named `test` -- the required context
  # of that name is produced by the `test` job at the end of this file, which reports on every
  # PR. A job that legitimately skips must never carry a required context name; that is exactly
  # the starvation this lane removed.
  test-suite:
    name: test-suite
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload; GitHub App still required for reliable PR comments
    env:
      COVERAGE_MIN: "90"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
        with:
          envtest: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.51.1
      - name: Unit tests and coverage floor
        run: task coverage
        env:
          CI: "true"
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tee coverage-summary.txt
      - name: Job summary
        run: |
          echo "### Coverage" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          tail -20 coverage-summary.txt >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.out
            coverage-summary.txt
          if-no-files-found: error
      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          fail_ci_if_error: false
          use_oidc: true

  build:
    name: build
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.51.1
      - name: Build manager
        run: task build

  test-integration:
    name: test-integration
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.51.1
      - name: Verify Forgejo pre-pull safeguards
        run: bash test/ci/forgejo_prepull_test.sh
      - name: Pre-pull Forgejo image
        run: bash hack/ci/pull-image-with-retry.sh "codeberg.org/forgejo/forgejo:11"
      - name: Integration tests (testcontainers)
        run: task test-integration
        env:
          CI: "true"

  helm:
    name: helm
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.51.1
      - name: Install Helm
        env:
          HELM_VERSION: v3.21.4
        run: bash hack/install-helm.sh
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.5.1
      - name: Helm lint and unittest
        run: task helm-test

  perf-report:
    name: perf-report
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
        with:
          envtest: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.51.1
      - name: Performance snapshot (optional gate)
        run: task perf-report
        env:
          CI: "true"
      - name: Upload perf snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-snapshot
          path: artifacts/perf-snapshot.md
          retention-days: 14
          if-no-files-found: warn
      - name: Job summary
        if: always()
        run: |
          {
            echo "### perf-report (optional)"
            echo "Runs \`task perf-report\` (bench excerpt + unit pass). Does not block merge."
            if [[ -f artifacts/perf-snapshot.md ]]; then
              echo ""
              echo "Snapshot excerpt:"
              echo '```'
              sed -n '1,24p' artifacts/perf-snapshot.md
              echo '```'
            fi
            echo "Download \`perf-snapshot\` artifact for full report. Regenerate locally before scale work — see [PERFORMANCE.md](https://github.com/platformrelay/kollect/blob/main/docs/PERFORMANCE.md)."
          } >> "${GITHUB_STEP_SUMMARY}"

  fuzz:
    name: fuzz
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzContentHash
            pkg: ./internal/aggregate/...
          - target: FuzzExtractJSONPath
            pkg: ./internal/collect/...
          - target: FuzzExtractCEL
            pkg: ./internal/collect/...
          - target: FuzzValidateAttributePath
            pkg: ./internal/collect/...
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
        with:
          cache-suffix: fuzz-${{ matrix.target }}
      - name: Native Go fuzz (30s)
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_PKG: ${{ matrix.pkg }}
        # Retry transient failures only. A reproducible crash writes a seed
        # under testdata/fuzz/ and fails every run, so if that corpus appears
        # we bail immediately rather than mask a real finding. Retries cover
        # the runner-contention artifact where the engine reports
        # "context deadline exceeded" at the fuzztime boundary.
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            if go test -run='^$' -fuzz="${FUZZ_TARGET}" -fuzztime=30s "${FUZZ_PKG}"; then
              exit 0
            fi
            if git status --porcelain | grep -q 'testdata/fuzz/'; then
              echo "::error::${FUZZ_TARGET} produced a crashing input — not retrying"
              exit 1
            fi
            echo "::warning::${FUZZ_TARGET} failed transiently on attempt ${attempt} (no crash corpus); retrying"
          done
          exit 1

  # SonarCloud: GitHub secret SONAR_TOKEN (SonarCloud analysis token). Local dev uses
  # SONARCLOUD_TOKEN in .envrc — same value, different name (see tooling-setup.md).
  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    # The `coverage` artifact comes from test-suite, so this follows the real job, not the
    # `test` report. A docs-only PR skips test-suite and therefore skips this too.
    needs: [test-suite]
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
      - name: Gate on SONAR_TOKEN
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "has_token=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::SONAR_TOKEN secret is unset; SonarCloud scan skipped (configure org token — see docs/development/tooling-setup.md)."
          else
            echo "has_token=true" >> "${GITHUB_OUTPUT}"
          fi
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        if: steps.sonar.outputs.has_token == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    name: docker-build
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.51.1
      - name: Build controller image
        run: task docker:build

      # kollect-pipeline image (ADR-0801 P-006). release.yaml only builds it on v* tags, so this
      # PR-time build+run smoke is the first place a broken Dockerfile.pipeline or entrypoint is
      # caught. Single-arch (native runner) to stay fast; the release job builds multi-arch.
      - name: Build kollect-pipeline image
        run: task docker:build:pipeline

      - name: Smoke test kollect-pipeline image (--help exits 0)
        run: docker run --rm kollect-pipeline:dev --help

      - name: Assert kollect-pipeline image runs as nonroot (UID 65532)
        run: |
          user="$(docker inspect --format '{{.Config.User}}' kollect-pipeline:dev)"
          echo "image user: ${user}"
          if [ "${user}" != "65532:65532" ]; then
            echo "::error::kollect-pipeline image must run as 65532:65532, got '${user}'" >&2
            exit 1
          fi

  # CI-DOCSGATE-01: the required context `test` (protect-main lists it by exact string).
  #
  # This job is a REPORT and nothing else -- it exists so that the context reaches a conclusion
  # on EVERY pull request, including a documentation-only one where `test-suite` is skipped.
  # `if: always()` is what makes that work: without it a skipped `test-suite` would skip this
  # job too, and the context would vanish from the PR exactly as it did when the whole workflow
  # was excluded by `paths-ignore`.
  #
  # It cannot stand in for the real suite. Whenever the change touches anything outside the
  # documentation path set it fails unless `test-suite` actually SUCCEEDED -- a skipped,
  # failed or cancelled worker reds the context. The comparison is `!= "false"`, not
  # `== "true"`, so an empty or corrupted verdict from the `changes` job also demands a real
  # success. hack/test/ci_docs_gate_test.sh executes this exact body against that truth table.
  test:
    name: test
    needs: [changes, test-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report the required test context
        shell: bash
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.test-suite.result }}
        run: |
          set -euo pipefail
          if [ "${CODE}" != "false" ]; then
            if [ "${RESULT}" != "success" ]; then
              echo "::error::the test-suite job must succeed on a change that touches non-documentation paths (changes.code='${CODE}', test-suite='${RESULT}')"
              exit 1
            fi
            echo "code change: test-suite succeeded"
            exit 0
          fi
          case "${RESULT}" in
          failure | cancelled)
            echo "::error::documentation-only change, but test-suite reported '${RESULT}'"
            exit 1
            ;;
          esac
          echo "documentation-only change: test-suite '${RESULT}', required context reported without running the Go suite"
