# CI path filter matrix (see docs/development/testing.md):
# - Changes limited to docs/**, mkdocs.yml, README.md, CHANGELOG.md, CONTRIBUTING.md, LICENSE,
#   or issue templates skip this workflow; other root Markdown files still run full CI.
#   The Docs workflow runs lint-markdown + MkDocs build/deploy for its path-scoped inputs.
# - Any change under api/, internal/, charts/, cmd/, config/, hack/, test/, go.mod, or
#   .github/workflows/ always runs full CI. Mixed PRs (docs + code) run everything.
# - protect-main requires `test` and `kind-smoke` from this workflow. A docs-only PR
#   therefore stays BLOCKED (those jobs never report). Touch a watched path, or merge
#   will wait forever.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          bash hack/install-gitleaks.sh "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Scan repository
        run: gitleaks detect --source . --config .github/gitleaks.toml --verbose --redact --no-git

  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1
      - name: Verify generated artifacts
        run: task verify
        env:
          CI: "true"

  audit-rbac:
    name: audit-rbac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: RBAC security audit (Polaris + kubeaudit)
        run: bash hack/audit-rbac.sh
        env:
          POLARIS_VERSION: "9.6.0"
          KUBEAUDIT_VERSION: "0.22.2"

  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1
      - name: govulncheck
        run: task vulncheck

  # lint job runs `task lint` → golangci-lint v2 (depguard, gomodguard, …) + go-arch-lint
  # (internal/ package graph; see .go-arch-lint.yml). No separate arch-lint step needed.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1
      - name: Check formatting
        run: task format:check
      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
        run: |
          bash hack/install-shellcheck.sh "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Lint shell scripts
        run: task lint:shell
      - name: Verify scanner download checksums (unit + negative)
        run: |
          bash hack/test/verify-sha256_test.sh
          bash hack/test/install-checksum-negative_test.sh
      - name: Verify demo-up/demo-down task aliases
        run: bash hack/test/demo_task_aliases_test.sh
      - name: Verify default samples are credential-free (DEMO-01)
        run: bash hack/test/demo_01_default_samples_test.sh
      - name: Verify demo sample Kustomizations render (DOC-04)
        run: bash hack/test/demo_04_samples_kustomize_test.sh
      - name: Install Helm
        env:
          HELM_VERSION: v3.17.3
        run: bash hack/install-helm.sh
      - name: Ensure yq is available
        run: |
          # ubuntu-latest images generally ship yq, but don't assume it --
          # some sonar_ko_* meta-tests (chart-rendering ones) need it.
          command -v yq >/dev/null 2>&1 || sudo snap install yq
          yq --version
      # DIST-OH-02: dist_olm_bundle_test.sh hard-requires operator-sdk for the OperatorHub
      # validator gate (operatorhubv2 / capabilities / categories). Installing it here is what
      # makes that gate actually run in CI instead of skipping -- a skipped gate would read as
      # coverage that does not exist. The gate resolves ./bin/operator-sdk first, so install there.
      - name: Install operator-sdk (OLM bundle validators)
        env:
          OPERATOR_SDK_VERSION: v1.42.3
        run: bash hack/install-operator-sdk.sh ./bin
      - name: Verify nightly advisory race job contract (HY-07)
        run: bash hack/test/hyg_07_nightly_race_test.sh
      - name: Verify manager RBAC grants core Events (not events.k8s.io)
        run: bash hack/test/core_events_rbac_test.sh
      - name: Verify manager RBAC can read KollectClusterScope
        run: bash hack/test/cluster_scope_rbac_test.sh
      - name: Verify changelog-sync release guard (fbb5196a3 regression lock)
        run: bash hack/test/changelog_sync_release_guard_test.sh
      # LAB-DEKIND: this suite is the enforcement mechanism for the lab substrate allowlist
      # (default-deny on kube contexts) and the non-Kind image-delivery policy. It was only
      # reachable via hack/docs/verify.sh in the path-filtered docs workflow, whose filter
      # does not include hack/lab/** — so a change to the harness itself never triggered it.
      # Run it here, unconditionally, where the guard actually protects something.
      - name: Lab harness offline meta-tests (substrate allowlist, image delivery, pprof)
        run: bash hack/test/lab_harness_meta_suite.sh
      - name: Run Sonar SECURITY remediation meta-tests
        run: |
          shopt -s nullglob
          scripts=(hack/test/sonar_ko_*_test.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no hack/test/sonar_ko_*_test.sh scripts yet"
          fi
          for script in "${scripts[@]}"; do
            echo "::group::${script}"
            bash "${script}"
            echo "::endgroup::"
          done
      - name: Hub distribution meta-tests
        run: |
          shopt -s nullglob
          scripts=(hack/test/dist_*_test.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no hack/test/dist_*_test.sh scripts yet"
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "::group::${script}"
            bash "${script}"
            echo "::endgroup::"
          done
      - name: Lint
        run: task lint

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload; GitHub App still required for reliable PR comments
    env:
      COVERAGE_MIN: "90"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
        with:
          envtest: true
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1
      - name: Unit tests and coverage floor
        run: task coverage
        env:
          CI: "true"
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tee coverage-summary.txt
      - name: Job summary
        run: |
          echo "### Coverage" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          tail -20 coverage-summary.txt >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.out
            coverage-summary.txt
          if-no-files-found: error
      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          fail_ci_if_error: false
          use_oidc: true

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1
      - name: Build manager
        run: task build

  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1
      - name: Verify Forgejo pre-pull safeguards
        run: bash test/ci/forgejo_prepull_test.sh
      - name: Pre-pull Forgejo image
        run: bash hack/ci/pull-image-with-retry.sh "codeberg.org/forgejo/forgejo:11"
      - name: Integration tests (testcontainers)
        run: task test-integration
        env:
          CI: "true"

  helm:
    name: helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1
      - name: Install Helm
        env:
          HELM_VERSION: v3.17.3
        run: bash hack/install-helm.sh
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.5.1
      - name: Helm lint and unittest
        run: task helm-test

  perf-report:
    name: perf-report
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
        with:
          envtest: true
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1
      - name: Performance snapshot (optional gate)
        run: task perf-report
        env:
          CI: "true"
      - name: Upload perf snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-snapshot
          path: artifacts/perf-snapshot.md
          retention-days: 14
          if-no-files-found: warn
      - name: Job summary
        if: always()
        run: |
          {
            echo "### perf-report (optional)"
            echo "Runs \`task perf-report\` (bench excerpt + unit pass). Does not block merge."
            if [[ -f artifacts/perf-snapshot.md ]]; then
              echo ""
              echo "Snapshot excerpt:"
              echo '```'
              sed -n '1,24p' artifacts/perf-snapshot.md
              echo '```'
            fi
            echo "Download \`perf-snapshot\` artifact for full report. Regenerate locally before scale work — see [PERFORMANCE.md](https://github.com/platformrelay/kollect/blob/main/docs/PERFORMANCE.md)."
          } >> "${GITHUB_STEP_SUMMARY}"

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzContentHash
            pkg: ./internal/aggregate/...
          - target: FuzzExtractJSONPath
            pkg: ./internal/collect/...
          - target: FuzzExtractCEL
            pkg: ./internal/collect/...
          - target: FuzzValidateAttributePath
            pkg: ./internal/collect/...
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
        with:
          cache-suffix: fuzz-${{ matrix.target }}
      - name: Native Go fuzz (30s)
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_PKG: ${{ matrix.pkg }}
        # Retry transient failures only. A reproducible crash writes a seed
        # under testdata/fuzz/ and fails every run, so if that corpus appears
        # we bail immediately rather than mask a real finding. Retries cover
        # the runner-contention artifact where the engine reports
        # "context deadline exceeded" at the fuzztime boundary.
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            if go test -run='^$' -fuzz="${FUZZ_TARGET}" -fuzztime=30s "${FUZZ_PKG}"; then
              exit 0
            fi
            if git status --porcelain | grep -q 'testdata/fuzz/'; then
              echo "::error::${FUZZ_TARGET} produced a crashing input — not retrying"
              exit 1
            fi
            echo "::warning::${FUZZ_TARGET} failed transiently on attempt ${attempt} (no crash corpus); retrying"
          done
          exit 1

  # SonarCloud: GitHub secret SONAR_TOKEN (SonarCloud analysis token). Local dev uses
  # SONARCLOUD_TOKEN in .envrc — same value, different name (see tooling-setup.md).
  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
      - name: Gate on SONAR_TOKEN
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "has_token=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::SONAR_TOKEN secret is unset; SonarCloud scan skipped (configure org token — see docs/development/tooling-setup.md)."
          else
            echo "has_token=true" >> "${GITHUB_OUTPUT}"
          fi
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        if: steps.sonar.outputs.has_token == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1
      - name: Build controller image
        run: task docker:build

      # kollect-pipeline image (ADR-0801 P-006). release.yaml only builds it on v* tags, so this
      # PR-time build+run smoke is the first place a broken Dockerfile.pipeline or entrypoint is
      # caught. Single-arch (native runner) to stay fast; the release job builds multi-arch.
      - name: Build kollect-pipeline image
        run: task docker:build:pipeline

      - name: Smoke test kollect-pipeline image (--help exits 0)
        run: docker run --rm kollect-pipeline:dev --help

      - name: Assert kollect-pipeline image runs as nonroot (UID 65532)
        run: |
          user="$(docker inspect --format '{{.Config.User}}' kollect-pipeline:dev)"
          echo "image user: ${user}"
          if [ "${user}" != "65532:65532" ]; then
            echo "::error::kollect-pipeline image must run as 65532:65532, got '${user}'" >&2
            exit 1
          fi
