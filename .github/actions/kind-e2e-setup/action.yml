name: Kind E2E setup and run
description: >-
  Install cached kind/helm, create an isolated e2e cluster, optionally run a scenario script,
  and always teardown. Shared by e2e-smoke, e2e-nightly, e2e-extended, and test-e2e workflows.
inputs:
  envtest:
    description: Restore kubebuilder-envtest cache via go-cache
    required: false
    default: "true"
  setup-script:
    description: Cluster bootstrap script (relative to repo root)
    required: false
    default: hack/kind/e2e/setup.sh
  scenario-script:
    description: Optional post-setup scenario script (relative to repo root)
    required: false
    default: ""
  run-mode:
    description: Scenario runner mode — bash or repo_root
    required: false
    default: bash
  wait-timeout:
    description: Bounded wait for reconciliation scripts
    required: false
    default: 300s
  github-token:
    description: Optional GITHUB_TOKEN for git-export remote SHA assert
    required: false
    default: ""
  git-export-test-repo:
    description: >-
      Optional repository variable GIT_EXPORT_TEST_REPO (owner/repo URL) for full git-export assert.
      Set in GitHub repo Settings → Secrets and variables → Actions → Variables.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: ./.github/actions/go-cache
      with:
        envtest: ${{ inputs.envtest }}

    - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        version: 3.51.1

    - name: Restore kind binary cache
      id: kind-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/kind/kind-0.32.0
        key: kind-0.32.0-linux-amd64

    # CI-KINDLOOP-01. The three-attempt loop that used to live here is the reason this step is
    # worth a comment. It looked hardened -- protocol pinning, curl-level retries, a connect
    # timeout -- so it was the pattern in this repo that got copied. Two things were wrong with
    # it, and the second is why CI-HELMDL-01 deliberately declined to imitate it:
    #
    #   * it FELL THROUGH when all three attempts failed. `set -euo pipefail` still failed the
    #     job, at the next command, so it was never a false green -- but the next command was
    #     `chmod +x` on a file that had never been written, so an unreachable kind.sigs.k8s.io
    #     was reported to the operator as "No such file or directory". That is the difference
    #     between a two-minute triage and a twenty-minute one on a required check;
    #   * it slept 10 seconds after its FINAL attempt, pure dead time on a job already doomed.
    #
    # Both are fixed by deleting the loop rather than repairing it: retry policy now lives in
    # hack/lib/fetch.sh, the same helper every hack/install-*.sh uses, so the kind download and
    # the helm download in this one step can no longer drift apart the way they had (the helm
    # side was bare `curl -fsSL`, which is what reddened kind-smoke on PR #351). fetch_to fails
    # AT the download, names the host and curl's exit code, and does not sleep after its last
    # attempt.
    #
    # Sourcing a repo script from a composite action is safe here and not a new dependency: this
    # step already runs `bash hack/install-helm.sh`, so it already requires the checkout to be
    # present with the repository root as the working directory. The helper is sourced through
    # ${GITHUB_WORKSPACE} rather than a bare relative path so it does not silently depend on that
    # working directory staying what it is.
    - name: Install kind and helm
      shell: bash
      env:
        HELM_VERSION: v3.21.4
      run: |
        set -euo pipefail
        source "${GITHUB_WORKSPACE}/hack/lib/fetch.sh"
        mkdir -p ~/.cache/kind
        if [[ "${{ steps.kind-cache.outputs.cache-hit }}" != "true" ]]; then
          fetch_to "https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64" \
            ~/.cache/kind/kind-0.32.0 "kind v0.32.0 binary"
          chmod +x ~/.cache/kind/kind-0.32.0
        fi
        sudo install -m 0755 ~/.cache/kind/kind-0.32.0 /usr/local/bin/kind
        bash hack/install-helm.sh

    - name: Create kind cluster and install operator
      shell: bash
      env:
        KIND_CLUSTER_WAIT: 300s
        KOLLECT_HELM_TIMEOUT: 300s
        KOLLECT_MANAGER_WAIT: 300s
      run: bash "${{ inputs.setup-script }}"

    - name: Run e2e scenario
      if: inputs.scenario-script != ''
      shell: bash
      env:
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GIT_EXPORT_TEST_REPO: ${{ inputs.git-export-test-repo }}
      run: |
        set -euo pipefail
        script="${{ inputs.scenario-script }}"
        chmod +x "${script}"
        case "${{ inputs.run-mode }}" in
          bash) bash "${script}" ;;
          repo_root) REPO_ROOT="${GITHUB_WORKSPACE}" "${script}" ;;
          *) echo "unknown run-mode: ${{ inputs.run-mode }}" >&2; exit 1 ;;
        esac

    - name: Delete kind cluster
      if: always()
      shell: bash
      run: bash hack/kind/e2e/teardown.sh
